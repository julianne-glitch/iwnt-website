<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 72" fill="none">
  <!-- NETWORK NODES ICON -->
  <g transform="translate(4, 6)">
    <!-- Connecting Lines -->
    <line x1="12" y1="14" x2="48" y2="14" stroke="#64748B" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
    <line x1="48" y1="14" x2="48" y2="48" stroke="#64748B" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
    <line x1="12" y1="14" x2="30" y2="31" stroke="#64748B" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
    <line x1="48" y1="14" x2="30" y2="31" stroke="#64748B" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
    <line x1="12" y1="48" x2="30" y2="31" stroke="#64748B" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
    <line x1="48" y1="48" x2="30" y2="31" stroke="#64748B" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>

